quarkus.banner.enabled=false
quarkus.http.host=127.0.0.1
quarkus.log.level=INFO
quarkus.log.min-level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.package.jar.type=fast-jar

# The smoke fixture uses the real SmallRye Kafka connector and Quarkus Artemis JMS extension.
# Runtime tests override both endpoints; no broker is embedded in the product extension.
kafka.bootstrap.servers=${O11Y_QUARKUS_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
mp.messaging.outgoing.o11y-kafka-out.connector=smallrye-kafka
mp.messaging.outgoing.o11y-kafka-out.enabled=${o11y.messaging.enabled:false}
mp.messaging.outgoing.o11y-kafka-out.topic=o11y.quarkus.exchange
mp.messaging.outgoing.o11y-kafka-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.incoming.o11y-kafka-in.connector=smallrye-kafka
mp.messaging.incoming.o11y-kafka-in.enabled=${o11y.messaging.enabled:false}
mp.messaging.incoming.o11y-kafka-in.topic=o11y.quarkus.exchange
mp.messaging.incoming.o11y-kafka-in.group.id=o11y-quarkus-smoke
mp.messaging.incoming.o11y-kafka-in.auto.offset.reset=earliest
mp.messaging.incoming.o11y-kafka-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

quarkus.artemis.enabled=${o11y.messaging.enabled:false}
quarkus.artemis.url=${O11Y_QUARKUS_ARTEMIS_URL:tcp://127.0.0.1:61616}
quarkus.artemis.username=${O11Y_QUARKUS_ARTEMIS_USERNAME:}
quarkus.artemis.password=${O11Y_QUARKUS_ARTEMIS_PASSWORD:}

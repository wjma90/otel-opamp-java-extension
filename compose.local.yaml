name: o11y-java-extension-local

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: o11y_extension_local
      POSTGRES_USER: o11y_local
      POSTGRES_PASSWORD: o11y-local-password
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U o11y_local -d o11y_extension_local
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

  control-plane:
    image: o11y-control-plane:local
    pull_policy: never
    environment:
      DATABASE_URL: postgres://o11y_local:o11y-local-password@postgres:5432/o11y_extension_local?sslmode=disable
      MASTER_USERNAME: o11y-admin
      MASTER_PASSWORD: o11y-local-admin-password
      MASTER_EMAIL: local-admin@example.test
      AUTH_SIGNING_KEY: o11y-local-signing-key-for-manual-development-only
      OPAMP_AUTH_MODE: disabled
      SERVER_PUBLIC_URL: http://127.0.0.1:18080
      OPAMP_PUBLIC_URL: http://127.0.0.1:14320/v1/opamp
    ports:
      - 127.0.0.1:18080:8080
      - 127.0.0.1:14320:4320
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  collector:
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./dev/otelcol.local.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:14317:4317
      - 127.0.0.1:14318:4318
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true

